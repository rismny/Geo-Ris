<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="poly" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.25"/>
    </linearGradient>
    <linearGradient id="stroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="108" fill="url(#bg)"/>
  <rect width="504" height="504" x="4" y="4" rx="104" fill="none" stroke="#1e293b" stroke-width="4"/>
  
  <!-- Grid Lines -->
  <line x1="64" y1="128" x2="448" y2="128" stroke="#1e293b" stroke-width="2" stroke-dasharray="8 8"/>
  <line x1="64" y1="256" x2="448" y2="256" stroke="#1e293b" stroke-width="2" stroke-dasharray="8 8"/>
  <line x1="64" y1="384" x2="448" y2="384" stroke="#1e293b" stroke-width="2" stroke-dasharray="8 8"/>
  <line x1="128" y1="64" x2="128" y2="448" stroke="#1e293b" stroke-width="2" stroke-dasharray="8 8"/>
  <line x1="256" y1="64" x2="256" y2="448" stroke="#1e293b" stroke-width="2" stroke-dasharray="8 8"/>
  <line x1="384" y1="64" x2="384" y2="448" stroke="#1e293b" stroke-width="2" stroke-dasharray="8 8"/>

  <!-- Cadastral Polygon -->
  <polygon points="120,180 320,130 420,290 310,400 150,360" fill="url(#poly)" stroke="url(#stroke)" stroke-width="12" stroke-linejoin="round"/>

  <!-- Surveyor Patok Pins -->
  <circle cx="120" cy="180" r="16" fill="#ef4444" stroke="#ffffff" stroke-width="4"/>
  <circle cx="320" cy="130" r="16" fill="#10b981" stroke="#ffffff" stroke-width="4"/>
  <circle cx="420" cy="290" r="16" fill="#f59e0b" stroke="#ffffff" stroke-width="4"/>
  <circle cx="310" cy="400" r="16" fill="#3b82f6" stroke="#ffffff" stroke-width="4"/>
  <circle cx="150" cy="360" r="16" fill="#8b5cf6" stroke="#ffffff" stroke-width="4"/>

  <!-- Compass / Crosshair Accent -->
  <circle cx="260" cy="270" r="28" fill="none" stroke="#38bdf8" stroke-width="3" opacity="0.6"/>
  <line x1="260" y1="230" x2="260" y2="310" stroke="#38bdf8" stroke-width="3" opacity="0.8"/>
  <line x1="220" y1="270" x2="300" y2="270" stroke="#38bdf8" stroke-width="3" opacity="0.8"/>
</svg>
